services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: dotwatch
      POSTGRES_PASSWORD: dotwatch
      POSTGRES_DB: dotwatch
    ports:
      - "5432:5432"
    volumes:
      - dotwatch-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dotwatch -d dotwatch"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  dotwatch-db:
