# Render Blueprint: ONE service serves the web app, the API and the device endpoint at one address.
# Free plan: sleeps after 15 minutes without traffic, so an uptime monitor calls /health every 5 minutes
# (docs/DEPLOY.md). One service running all month fits Render's 750 free hours per workspace.
# To upgrade later: set plan to starter.
services:
  - type: web
    # Kept as "dotwatch-api" so the existing service and its address stay the same.
    name: dotwatch-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npm run build -w @dotwatch/api && npm run build -w @dotwatch/web
    # Free services have no pre-deploy step, so migrations run at start (advisory lock, safe to repeat).
    startCommand: npm run migrate:prod -w @dotwatch/api && npm start -w @dotwatch/api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: AUTH_MODE
        value: firebase
      - key: REQUIRE_TIMESCALE
        value: "true"
      - key: APP_TIMEZONE
        value: Asia/Bangkok
      # Generated once by Render. Never change it: every device secret depends on it.
      - key: DEVICE_SECRET_PEPPER
        generateValue: true
      # The only three values to fill in:
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      # Optional, add in the dashboard when needed: LINE_CHANNEL_ACCESS_TOKEN, LINE_CHANNEL_SECRET,
      # RESEND_API_KEY, EMAIL_FROM, FIREBASE_AUTH_DOMAIN (defaults to <project>.firebaseapp.com).
